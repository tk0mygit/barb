name: Build and deploy BARB
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # schedule is intentionally disabled pending user approval of frequency/time.
  # The classifier and E2E runner already require full E2E for schedule events.
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Unit tests, build and E2E plan
    runs-on: ubuntu-latest
    outputs:
      run_regular: ${{ steps.prepare.outputs.run_regular }}
      run_mobile: ${{ steps.prepare.outputs.run_mobile }}
      artifact_id: ${{ steps.diagnostics.outputs.artifact-id }}
      pages_artifact_id: ${{ steps.pages.outputs.artifact_id }}
    steps:
      - uses: actions/checkout@v4
        id: checkout
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        id: node
        with:
          node-version: 24
          cache: npm
      - name: Classify complete PR diff
        id: classify
        run: node scripts/ci-risk.js --output .ci/plan.json
      - run: npm ci
        id: install
      - name: Record validation plan
        id: plan
        run: node scripts/ci-summary.js plan
      - run: npm test
        id: unit
      - run: npm run build
        id: build
      - name: Collect original selection and prepare independent lanes
        id: prepare
        # --list needs no browser. L0/main push record explicit non-execution.
        run: node scripts/ci-e2e.js prepare
      - uses: actions/upload-pages-artifact@v3
        id: pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: dist
      - name: Seal build validation record
        if: always()
        env:
          CI_RECORD_JOB: build
          CI_STEPS: ${{ toJSON(steps) }}
          CI_JOB_STATUS: ${{ job.status }}
        run: node scripts/ci-summary.js record
      - name: Upload build and validation records
        id: diagnostics
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}-build
          path: |
            dist/
            .ci/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  e2e_regular:
    name: Regular E2E (workers=1)
    needs: build
    if: needs.build.outputs.run_regular == 'true'
    runs-on: ubuntu-latest
    outputs:
      artifact_id: ${{ steps.diagnostics.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
        id: checkout
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        id: node
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        id: install
      - uses: actions/download-artifact@v4
        id: download
        with:
          name: ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}-build
          path: .ci-input
      - name: Set up Chromium
        id: chromium
        run: npx playwright install --with-deps chromium
      - name: Validate selection and run regular E2E
        id: e2e
        run: node scripts/ci-e2e.js run regular
      - name: Seal regular validation record
        if: always()
        env:
          CI_RECORD_JOB: regular
          CI_STEPS: ${{ toJSON(steps) }}
          CI_JOB_STATUS: ${{ job.status }}
        run: node scripts/ci-summary.js record
      - name: Upload regular browser diagnostics and validation records
        id: diagnostics
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}-regular
          path: |
            test-results/
            .ci/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  e2e_mobile:
    name: Mobile performance E2E (workers=1)
    needs: build
    if: needs.build.outputs.run_mobile == 'true'
    runs-on: ubuntu-latest
    outputs:
      artifact_id: ${{ steps.diagnostics.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
        id: checkout
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        id: node
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        id: install
      - uses: actions/download-artifact@v4
        id: download
        with:
          name: ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}-build
          path: .ci-input
      - name: Set up Chromium
        id: chromium
        run: npx playwright install --with-deps chromium
      - name: Validate selection and run all mobile performance E2E
        id: e2e
        run: node scripts/ci-e2e.js run mobile
      - name: Seal mobile validation record
        if: always()
        env:
          CI_RECORD_JOB: mobile
          CI_STEPS: ${{ toJSON(steps) }}
          CI_JOB_STATUS: ${{ job.status }}
        run: node scripts/ci-summary.js record
      - name: Upload mobile browser diagnostics and validation records
        id: diagnostics
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}-mobile
          path: |
            test-results/
            .ci/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  required:
    name: ci-required
    # Without always(), any failed/skipped need can skip the final check.
    if: always()
    needs: [build, e2e_regular, e2e_mobile]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        id: checkout
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        id: node
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        id: install
      - name: Download separate validation artifacts
        id: download
        uses: actions/download-artifact@v4
        with:
          pattern: ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}-*
          path: .ci-artifacts
          merge-multiple: false
      - name: Verify required outcomes and record result
        if: always()
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
          CI_STEPS: ${{ toJSON(steps) }}
          CI_JOB_STATUS: ${{ job.status }}
        run: |
          if test -f scripts/ci-summary.js; then
            node scripts/ci-summary.js result
          else
            printf '### CI validation result\n\n検証失敗・中断。E2E成功は確認できません。\n' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
  deploy:
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.build.result == 'success' && needs.required.result == 'success' }}
    needs: [build, required]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
