name: Build and deploy BARB
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # schedule is intentionally disabled pending user approval of frequency/time.
  # The classifier and E2E runner already require full E2E for schedule events.
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: ci-required
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        id: checkout
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        id: node
        with:
          node-version: 24
          cache: npm
      - name: Classify complete PR diff
        id: classify
        run: node scripts/ci-risk.js --output .ci/plan.json
      - name: Record validation plan
        id: plan
        run: node scripts/ci-summary.js plan
      - run: npm ci
        id: install
      - run: npm test
        id: unit
      - run: npm run build
        id: build
      - name: Set up Chromium
        id: chromium
        if: steps.classify.outputs.run_e2e == 'true'
        run: npx playwright install --with-deps chromium
      - name: Validate selection and run required E2E
        id: e2e
        # Also runs for L0: rechecks the plan and records explicit non-execution.
        run: node scripts/ci-e2e.js
      - name: Upload browser failure diagnostics and validation records
        id: diagnostics
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-results
          path: |
            test-results/
            .ci/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-pages-artifact@v3
        id: pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: dist
      - name: Verify required outcomes and record result
        if: always()
        env:
          CI_STEPS: ${{ toJSON(steps) }}
          CI_JOB_STATUS: ${{ job.status }}
        run: |
          if test -f scripts/ci-summary.js; then
            node scripts/ci-summary.js result
          else
            printf '### CI validation result\n\n検証失敗・中断。E2E成功は確認できません。\n' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
